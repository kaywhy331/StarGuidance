[build]
  command = "corepack pnpm --filter @starguidance/web build"
  publish = "apps/web/.next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "24"
  PNPM_VERSION = "11.16.0"

[functions]
  directory = "netlify/functions"
  # Default bundler failed to resolve `postgres` (a transitive dependency
  # through the workspace:*-linked @starguidance/database) at runtime under
  # pnpm's symlinked node_modules — confirmed via a deployed smoke test.
  # esbuild traces and inlines dependencies into the bundle instead of
  # relying on a runtime node_modules lookup.
  node_bundler = "esbuild"

[context.deploy-preview.environment]
  APP_ENV = "staging"
  ENABLE_VISUAL_PREVIEW = "true"
  RUNTIME_ADAPTER = "supabase"

[[plugins]]
  package = "@netlify/plugin-nextjs"
