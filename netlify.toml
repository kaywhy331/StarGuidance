[build]
  command = "corepack pnpm --filter @starguidance/web build"
  publish = "apps/web/.next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "24"
  PNPM_VERSION = "11.16.0"

[functions]
  directory = "netlify/functions"
  # Neither the default bundler nor node_bundler = "esbuild" alone resolved
  # `postgres` at runtime — confirmed by two separate deployed smoke tests,
  # both failing identically with "Cannot find package 'postgres'" despite
  # it being a direct dependency with a correct local pnpm symlink. This
  # matches a known category of zip-it-and-ship-it auto-detection bug
  # (netlify/zip-it-and-ship-it#869) that reproduces only on Netlify's
  # remote build, not local tooling. external_node_modules sidesteps
  # automatic dependency tracing entirely: these are copied into the
  # deployed bundle's node_modules explicitly rather than detected.
  node_bundler = "esbuild"
  external_node_modules = ["postgres", "drizzle-orm"]

[context.deploy-preview.environment]
  APP_ENV = "staging"
  ENABLE_VISUAL_PREVIEW = "true"
  RUNTIME_ADAPTER = "supabase"

[[plugins]]
  package = "@netlify/plugin-nextjs"
