[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "starguidance-profile-engine"
version = "0.1.0"
description = "Deterministic, versioned profile calculations for StarGuidance"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["profile_engine"]
mypy_path = "src"
exclude = ["^build/"]

[tool.setuptools.packages.find]
where = ["src"]
